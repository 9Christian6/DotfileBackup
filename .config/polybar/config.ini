[colors]
background = #B0243969
background-alt = #3306080a
foreground = #dfdfdf
foreground-alt = #555
primary = #ff00ff
secondary = #00cc00
alert = #bd2c40

[bar/left]
enable-ipc = true
monitor = DP-2 
width = 100%
height = 35
radius = 6.0
fixed-center = true
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3
line-color = #f00

border-size = 0
border-color = #00000000

padding-left = 0
padding-right = 0

module-margin-left = 1
module-margin-right = 1

font-0 = DejaVu Sans Mono:size=10
font-1 = unifont:fontformat=truetype:size=8:antialias=false;0
font-2 = "CustomJetBrains:size=15"
font-3 = FontAwesome:style=Regular:size=10
font-4 = FontAwesome:style=Brands:size=10
font-5 = "Font Awesome 7 Brands"
font-6 = UbuntuMono Nerd Font
font-7 = Noto Color Emoji:style=Regular:scale=9

modules-left = i3 
modules-center = reminders tageslisten scratch 
modules-right = cputemp cpu disk memory nvidiatop day date animatedClock shutdown

tray-position = none
cursor-click = pointer
cursor-scroll = ns-resize

[bar/right]
enable-ipc = true
monitor = HDMI-0
width = 100%
;height = 27
height = 35
radius = 6.0
fixed-center = false
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3
line-color = #f00

border-size = 0
border-color = #00000000

padding-left = 0
padding-right = 0

module-margin-left = 1
module-margin-right = 1

font-0 = DejaVu Sans Mono:size=10
font-1 = unifont:fontformat=truetype:size=8:antialias=false;0
font-2 = "CustomJetBrains:size=15"
font-3 = FontAwesome:style=Regular:size=10
font-4 = FontAwesome:style=Brands:size=10
font-5 = "Font Awesome 7 Brands"
font-6 = UbuntuMono Nerd Font
font-7 = Noto Color Emoji:style=Regular:scale=9

modules-left = i3
# modules-center = reminders 
modules-right = timerIPC timerMessage timerTime network custom-volume-smooth weeks day date animatedClock shutdown

