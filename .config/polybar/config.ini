[module/dropdown]
type = custom/menu

; Text shown on the bar when the menu is closed
label-open = "Menu"

; Text shown on the bar when the menu is open (optional)
label-close = "Close"

; --- Level 0 (The Main Dropdown) ---

; Option 0
menu-0-0 = option0
menu-0-0-exec = notify-send "You clicked" "option0"

; Option 1
menu-0-1 = option1
menu-0-1-exec = notify-send "You clicked" "option1"

; Option 2
menu-0-2 = option2
menu-0-2-exec = notify-send "You clicked" "option2"

[module/apps]
type = custom/menu

label-open = Apps

menu-0-0 = Browsers
menu-0-0-exec = #apps.open.1
menu-0-1 = Multimedia
menu-0-1-exec = #apps.open.2

menu-1-0 = Firefox
menu-1-0-exec = firefox
menu-1-1 = Chromium
menu-1-1-exec = chromium

menu-2-0 = Gimp
menu-2-0-exec = gimp
menu-2-1 = Scrot
menu-2-1-exec = scrot

[module/tageslisten]
type = custom/ipc

; Polybar hook indices used by polybar-msg are 1-based:
; 1 -> hook-0, 2 -> hook-1, 3 -> hook-2, 4 -> hook-3
initial = 1

hook-0 = "$HOME/.config/polybar/scripts/tageslisten.sh" show
hook-1 = "$HOME/.config/polybar/scripts/tageslisten.sh" prev
hook-2 = "$HOME/.config/polybar/scripts/tageslisten.sh" next
hook-3 = "$HOME/.config/polybar/scripts/tageslisten.sh" remove
hook-4 = "$HOME/.config/polybar/scripts/tageslisten.sh" add

format = <label>
label = %output%
label-maxlen = 120

; Scroll up: previous line
scroll-up = polybar-msg -p %pid% hook tageslisten 2

; Scroll down: next line
scroll-down = polybar-msg -p %pid% hook tageslisten 3

; Left click: remove currently displayed line
click-left = polybar-msg -p %pid% hook tageslisten 4

; Left click: remove currently displayed line
click-right = polybar-msg -p %pid% hook tageslisten 5

[module/scratch]
type = custom/script
label = %output:0:30:…% 
label-foreground = ${colors.primary}
label-padding = 1
format-fail = ""
format-padding = 0

format-prefix = [
format-prefix-foreground = ${colors.primary}
format-suffix = ]
format-suffix-foreground = ${colors.primary}
exec = /home/christian/Bin/scratchpadIcons.py
interval = 1
click-left = exec i3-msg [class=.*] scratchpad show, floating disable

[module/memory]
type = internal/memory
interval = 3
; format =   <label>
format =  <label>
format-suffix = " |"
label = "%gb_used:8% / %gb_total:8%"

[module/disk]
type = custom/script
exec = df -h | grep "sda2" | awk '{printf "%s / %s", $3, $2}' | sed 's/G/ GB/g'
interval = 600
format-suffix = " |"
label            = 󰋊 %output%

[module/agenda]
type = custom/script
interval = 1
exec = /bin/python3 ~/Bin/Agenda.py
click-left = /bin/python3 -u ~/Bin/Agenda.py check
format-prefix =  "  "

[module/memory-info]
type = custom/script
interval = 3
exec = ~/Bin/memory.sh
click-left = ~/Bin/memory.sh --popup
format-prefix =  " "
format-suffix = " |"

[module/twitchFollows]
type = custom/script
exec = echo "Test"

[module/twitch-status]
type = custom/script
exec = /home/christian/Bin/twitch_wrapper.sh refresh
interval = 60
format = <label>
format-prefix = "Twitch: "
format-prefix-foreground = #999
label = %output%
label-foreground = #fff
scroll-up = /home/christian/Bin/twitch_wrapper.sh up
scroll-down = /home/christian/Bin/twitch_wrapper.sh down

[module/TagebuchErinnerung]
type = custom/script
interval = 3
exec = python3 ~/Bin/TagebuchErinnerung.py
click-left = python3 ~/Bin/Tagebuch.py
format-foreground = #ff0000

[module/DankbarkeitErinnerung]
type = custom/script
interval = 3
exec = python3 ~/Bin/DankbarkeitErinnerung.py
click-left = python3 ~/Bin/Dankbarkeitv2.py
format-foreground = #ff0000

[module/reminders]
type = custom/script
label = %output:0:50:…% 
exec = /home/christian/Bin/reminderScript.py check && echo $(/home/christian/Bin/reminderScript.py query --polybar)
interval = 1
click-left = ~/Bin/acknowledge.py ack
