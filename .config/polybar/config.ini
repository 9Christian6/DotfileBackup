[module/teeth]
type = custom/ipc
hook-0 = echo ""
hook-1 = echo "Brush teeth!🪥🦷"
initial = 1
click-left = polybar-msg action "#teeth.hook.0"
format-foreground = #ff0000

[module/timerMessage]
type = custom/script
interval = 0.1
exec = cat ~/Bin/timerMessage
exec-if = pgrep -fAc timer.py
hidden = true
click-right = ~/Bin/tts.sh /home/christian/Bin/timerMessage
click-left = polybar-msg action "#timerIPC.module_toggle" && polybar-msg action "#timerMessage.module_toggle"
format-suffix = " |"

[module/weather]
type = custom/script
exec = cat /tmp/polybar_weather_output
scroll-up = ~/Bin/weather_controller.sh up
scroll-down = ~/Bin/weather_controller.sh down
; Run 'init' once when the bar starts to create the first output
exec-if = test -f /tmp/polybar_weather_output
; Fallback if file doesn't exist yet (runs init in background)
hook-0 = ~/Bin/weather_controller.sh init &
format-suffix = " |"

[module/timerIPC]
type = custom/ipc
initial = 1
hook-0 = echo ""
hook-1 = cat ~/Bin/timerMessage
click-left = polybar-msg action "#timerIPC.module_toggle" && polybar-msg action "#timerMessage.module_toggle"
click-right = ~/Bin/tts.sh /home/christian/Bin/timerMessage
format-suffix = " |"
# click-left = polybar-msg action "#timer.next"

[module/timerTime]
type = custom/script
interval = 0.1
exec = cat ~/Bin/timeLeft | sed -n '1p' 
exec-if = pgrep -fAc timer.py
#click-left = notify-send "Timer Message" "$(cat /home/christian/Bin/timerMessage)"
click-left = polybar-msg action "#timerTime.module_toggle" && polybar-msg action "#timerMessage.module_toggle"
#click-right = ~/Bin/notifyMessage.sh ~/Bin/timerMessage
click-right = ~/Bin/timerMessage.sh
format-suffix = " |"

[module/timer]
type = custom/script
interval = 0.1
exec = cat ~/Bin/timeLeft | sed -n '1p' 
exec-if = ~/Bin/fileNotEmpty.sh ~/Bin/timeLeft
;click-left = cat ~/Bin/timeLeft | sed -n '2p' | xargs -I {} notify-send "{}"
click-left = notify-send "Timer Message" "$(cat /home/christian/Bin/timerMessage)"
format-suffix = " |"

[module/shutdown]
type = custom/script
exec = echo " "
click-left = exec ~/Bin/Shutdown

[module/animatedClock]
type = custom/script
exec = $HOME/.config/polybar/scripts/clock-emoji.sh
format = <label>
label = %output%
format-suffix = " |"
interval = 1
click-left = bash -c '/home/christian/Bin/timerMenu.sh&'

[module/weeks]
type = custom/script
exec = bash /home/christian/Bin/WeeksOfLife.sh
format-suffix = " |"

[module/i3]
type = internal/i3
reconnect = true
format = <label-state><label-mode>
format-suffix = "    "
pin-workspaces = true

; This will split the workspace name on ':'
; Default: false
strip-wsnumbers = false

; Sort the workspaces by index instead of the default
; sorting that groups the workspaces by output
; Default: false

index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = false
label-separator = "|"
label-separator-padding = 0
label-separator-foreground = #ffffff
; focused = Active workspace on focused monitor
label-focused-underline= ${colors.primary}
label-focused-padding = 0

label-unfocused-padding = 0

label-urgent-background = ${colors.alert}
label-urgent-padding = 0

label-visible-underline = ${colors.secondary}
label-visible-padding = 0

[module/temperature]
type = internal/temperature
interval = 0.5

; Thermal zone to use
; To list all the zone types, run 
; $ for i in /sys/class/thermal/thermal_zone*; do echo "$i: $(<$i/type)"; done
; Default: 0
thermal-zone = 0

; Select thermal zone by name
; The name has to match the contents of /sys/class/thermal/thermal_zone*/type
; for the desired thermal zone.
; New in version 3.7.0
; Default: ""
zone-type = x86_pkg_temp

; Full path of temperature sysfs path
; Use `sensors` to find preferred temperature source, then run
; $ for i in /sys/class/hwmon/hwmon*/temp*_input; do echo "$(<$(dirname $i)/name): $(cat ${i%_*}_label 2>/dev/null || echo $(basename ${i%_*})) $(readlink -f $i)"; done
; to find path to desired file
; Default reverts to thermal zone setting
hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon2/temp1_input

; Base temperature for where to start the ramp (in degrees celsius)
; Default: 0
base-temperature = 20

; Threshold temperature to display warning label (in degrees celsius)
; Default: 80
warn-temperature = 60
;
; Whether or not to show units next to the temperature tokens (°C, °F)
; Default: true
units = false

; Available tags:
;   <label> (default)
;   <ramp>
format = <ramp> <label>

; Available tags:
;   <label-warn> (default)
;   <ramp>
format-warn = <ramp> <label-warn>

; Available tokens:
;   %temperature% (deprecated)
;   %temperature-c%   (default, temperature in °C)
;   %temperature-f%   (temperature in °F)
;   %temperature-k%   (temperature in Kelvin, new in version 3.7.0)
label = TEMP %temperature-c%

; Available tokens:
;   %temperature% (deprecated)
;   %temperature-c%   (default, temperature in °C)
;   %temperature-f%   (temperature in °F)
;   %temperature-k%   (temperature in Kelvin, new in version 3.7.0)
label-warn = TEMP %temperature-c%
label-warn-foreground = #f00

; Requires the <ramp> tag
; The icon selection will range from `base-temperature` to `warn-temperature`,
  ; temperatures at and above `warn-temperature` will use the last icon
  ; and temperatures at and below `base-temperature` will use `ramp-0`. 
  ; All other icons are distributed evenly between the two temperatures.
  ramp-0 = A
  ramp-1 = B
  ramp-2 = C
  ramp-foreground = #55

  [module/nvidiatop]
  type = custom/script
  format-prefix = "󰢮  "
  exec = echo "$(/home/christian/Bin/polybar-nvidiatop --used-memory-mb) / $(/home/christian/Bin/polybar-nvidiatop --total-memory-mb)"
  interval = 3
  format-suffix = " |"

  [module/cputemp]
  type = custom/script
  exec = /home/christian/Bin/CPUTemp.sh
  click-left = kitty btop
  interval = 1

  ; Optional styling
  format-prefix-foreground = ${colors.foreground}
  format = <label>
  label = %output%

  [module/cpu]
  type = internal/cpu
  interval = 2.0
  format-suffix = " |"
  label = %percentage:2%% 
  format = %{A1:kitty btop:}<ramp-coreload> <label> %{A}
  ramp-coreload-spacing = 0

  ramp-coreload-0 = %{F#0000ff}▁%{F-}
  ramp-coreload-1 = %{F#2400ff}▂%{F-}
  ramp-coreload-2 = %{F#4900ff}▃%{F-}
  ramp-coreload-3 = %{F#6d00ff}▄%{F-}
  ramp-coreload-4 = %{F#9200ff}▅%{F-}
  ramp-coreload-5 = %{F#b600ff}▆%{F-}
  ramp-coreload-6 = %{F#db00ff}▇%{F-}
  ramp-coreload-7 = %{F#ff00ff}█%{F-}

  [module/time]
  type = internal/date
  interval = 1
  time =  %H:%M:%S
  label = %time%
  format-suffix = " |"

  [module/date]
  type = internal/date
  interval = 1
  date = "%d.%m.%Y"
  label = %date%
  format = %{A1:~/Bin/goToCalendar.sh:}  <label> %{A}
  format-suffix = " |"

  [module/day]
  type = internal/date
  interval = 1
  date = "%A"
  label = %date%
  format = <label>
  format-suffix = " |"

  [module/custom-volume-smooth]
  type = custom/script
  exec = /home/christian/Bin/PulseAudioWrapperSmooth.py
  hook-0 = $BIN/PulseAudioWrapperSmooth.py
  initial = 1
  interval = 0
  tail = true
# Scroll & click actions (instant refresh via hook)
  scroll-up = /home/christian/Bin/AdjustVolume.sh up
  scroll-down = /home/christian/Bin/AdjustVolume.sh down
  click-middle = /home/christian/Bin/CycleSoundSinks.py
  click-left = /home/christian/Bin/AdjustVolume.sh mute
  click-right = pavucontrol & i3-msg workspace number 21


  [module/custom-volume]
  type = custom/script
  exec = /home/christian/Bin/PulseaudioWrapper.sh
  hook-0 = $BIN/PulseaudioWrapper.sh
  initial = 1
  interval = 0
  tail = true

# Scroll & click actions (instant refresh via hook)
  scroll-up = /home/christian/Bin/AdjustVolume.sh up
  scroll-down = /home/christian/Bin/AdjustVolume.sh down
  click-middle = /home/christian/Bin/CycleSoundSinks.py
  click-left = /home/christian/Bin/AdjustVolume.sh mute
  click-right = pavucontrol & i3-msg workspace number 21

  [module/pulseaudio]
  type = internal/pulseaudio
  format-volume = <label-volume><bar-volume>
  format-volume-suffix = " |"
  label-volume = %percentage%%
  label-volume-foreground = ${root.foreground}
  label-volume-maxlen = 4
  label-volume-minlen = 4

#change volume on scroll
  scroll-up = pulseaudio-control --volume-max 10 up
  scroll-down = pulseaudio-control --volume-max 10 down

#open audio manager on click
  click-right = exec pavucontrol& i3-msg workspace number 15
  click-middle = exec /home/christian/Bin/cycleSoundSinks.sh

  format-muted-suffix = " |"
  format-muted = <label-muted><bar-volume>
  label-muted = %percentage%%
  label-muted-foreground = #666
  label-muted-maxlen = 8
  label-muted-minlen = 8

  bar-volume-width = 15
  bar-volume-foreground-0 = #55aa55
  bar-volume-foreground-1 = #55aa55
  bar-volume-foreground-2 = #55aa55
  bar-volume-foreground-3 = #55aa55
  bar-volume-foreground-4 = #55aa55
  bar-volume-foreground-5 = #f5a70a
  bar-volume-foreground-6 = #ff5555
  bar-volume-gradient = true
  bar-volume-indicator = |
  bar-volume-indicator-font = 2
  bar-volume-fill = ─
  bar-volume-fill-font = 2
  bar-volume-empty = ─
  bar-volume-empty-font = 2
  bar-volume-empty-foreground = ${colors.foreground-alt}

  [module/network]
  type = internal/network
  interface = enp42s0 
  interval = 0.5
  format-connected = <label-connected>
  format-connected-suffix = " |"
  label-connected = "%downspeed%"
  label-connected-alignment = right
  label-connected-maxlen = 8
  label-connected-minlen = 8
  label-disconnected = ""
  format-disconnected-suffix = " |"

  [module/previous]
  type = custom/ipc
  format-font = 2
  ; Default
  hook-0 = echo ""
  ; When spotify active
  hook-1 = echo ""
  click-left = "spotifyctl -q previous"

  [module/next]
  type = custom/ipc
  format-suffix = " |"
  ; Default
  hook-0 = echo ""
  ; When spotify active
  hook-1 = echo " "
  click-left = "spotifyctl -q next"

  [module/playpause]
  type = custom/ipc
  format-font = 5
  ; Default
  hook-0 = echo ""
  ; Playing
  hook-1 = echo ""
  ; Paused
  hook-2 = echo ""
  click-left = "spotifyctl -q playpause"

  [module/spotify]
  type = custom/ipc
  ; Default
  hook-0 = echo ""
  ; Playing/paused show song name and artist
  hook-1 = spotifyctl -q status --format '%artist%: %title%'
  initial = 1
  click-left = polybar-msg hook spotify 0
  format-suffix = " |"

