# Configuration for ~/Opt/picom-animations, checked against its local parser.
# References: src/config_libconfig.c, src/config.c and picom.sample.conf.
# Uncomment examples to enable them; effective existing settings are preserved.
# Conditions in exclusion arrays (entries are alternatives):
#   class_g = 'Name'       Exact application class; inspect with xprop WM_CLASS.
#   class_g ?= 'Name'      Case-insensitive class match.
#   name *= 'text'        Window title contains text.
#   window_type = 'dock'  Match an EWMH window type.
#   _GTK_FRAME_EXTENTS@:c Client property exists.
# Combine conditions with &&, || and !. Legacy n:e:Menu means name equals Menu.

# --- Animations ---
# Effects: "none", "auto", "fly-in", "zoom", "squeeze", "slide-up",
# "slide-down", "slide-left", "slide-right". auto lets the fork choose.
# Enable movement/scaling animations; transient windows include dialogs.
# animation-for-unmap-window = "auto"; # Closing/hiding; default.
# Global spring tuning (fork defaults): stiffness pulls harder, dampening
# reduces oscillation, and mass increases inertia.
# animation-stiffness = 200.0;
# animation-dampening = 25.0;
# animation-window-mass = 1.0;
# animation-delta = 10.0;         # Simulation timestep in milliseconds.
# animation-force-steps = false; # Force simulation steps under CPU load.
# animation-clamping = true;
# animation-exclude = [ "class_g = 'Example'" ];
# Per-type duration/stiffness/dampening settings are not supported.
animations = true;
animation-for-open-window = "zoom";
animation-for-transient-window = "zoom";
animation-for-workspace-switch-in = "auto";
animation-for-workspace-switch-out = "auto";

# --- Shadows ---
# Global switch; wintypes below can override it. Radius/offsets are pixels.
# shadow-opacity = 0.75; # 0.0 invisible .. 1.0 opaque.
# shadow-color = "#000000";
shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
# Titlebar/border opacity: 0.0 transparent .. 1.0 opaque.
frame-opacity = 0.7;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c",
  "name = 'cpt_frame_window'",
  "n:e:Menu"
];

# --- Opacity and focus ---
# Let inactive opacity override the window opacity property.
# active-opacity = 1.0;
# inactive-opacity = 1.0;
# Per-application opacity uses PERCENT:CONDITION:
# opacity-rule = [ "90:class_g = 'Alacritty'" ];
inactive-opacity-override = true;
# Darken inactive windows by 10%; 0.0 disables dimming.
# inactive-dim-fixed = true; # Do not scale dimming with window opacity.
inactive-dim = 0.1;
# true groups focus by WM_CLIENT_LEADER.
# detect-transient = true;      # Group focus via WM_TRANSIENT_FOR.
# detect-client-opacity = true; # Also read client-window opacity properties.
# use-ewmh-active-win = true;   # Determine focus from the WM active window.
detect-client-leader = false;
# Despite its name, matching windows are ALWAYS considered focused.
# This avoids inactive dimming; inactive-dim-exclude is unsupported.
focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'gnome-calendar'",
  "class_g = 'Dunst'",
  "class_g = 'steam'"
];

# --- Rounded corners ---
# Radius in pixels; 0 disables rounding. Exclusions apply when radius > 0.
corner-radius = 0;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Background blur ---
# Methods: "none", "kernel", "box", "gaussian", "dual_kawase".
# none disables blur; backend support varies.
# blur-size = 3;              # Box/Gaussian radius.
# blur-deviation = 0.84089642; # Gaussian standard deviation.
# blur-kern = "3x3box";       # Convolution kernel for method kernel.
# blur-background-frame = true; # Also blur translucent titlebars/borders.
# blur-background-fixed = true; # Do not vary blur with opacity.
# Fork-specific per-app strength; 0 disables blur for a match:
# blur-background-strength = [ "0:class_g = 'Alacritty'" ];
blur-method = "dual_kawase";
# Dual Kawase strength; higher values increase blur.
blur-strength = 7;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Rendering and diagnostics ---
# Current launcher supplies --backend glx --experimental-backends.
# Command-line settings override this file. Fork backends: xrender, glx,
# xr_glx_hybrid; upstream egl is not supported here.
# backend = "glx";
# experimental-backends is a command-line switch in this fork.
# VSync synchronizes presentation to reduce tearing.
vsync = true;
# Keep fullscreen windows composited. true can improve fullscreen performance,
# but redirect/unredirect transitions may flicker.
# unredir-if-possible-delay = 0; # Milliseconds before bypassing compositing.
# unredir-if-possible-exclude = [ "class_g = 'Example'" ];
unredir-if-possible = false;
# Repaint changed regions; false redraws everything (artifact workaround).
use-damage = true;
# Synchronize client drawing with X Sync fences; useful with some drivers.
xrender-sync-fence = true;
# true forces blending even for opaque windows (useful with custom shaders).
# glx-no-stencil = true;       # Driver-dependent GLX workaround.
# glx-no-rebind-pixmap = true; # Driver-dependent optimization.
# Upstream window-shader-fg and rules/shader config are not parsed here.
force-win-blend = false;
# Levels: trace, debug, info, warn, error.
# log-file = "/tmp/picom.log"; # Otherwise stderr; use an absolute path.
# dbus = true;                # Enable D-Bus remote control.
# write-pid-path = "/tmp/picom.pid";
log-level = "warn";

# --- Per-window-type overrides ---
# Types: unknown, desktop, dock, toolbar, menu, utility, splash, dialog, normal,
# dropdown_menu, popup_menu, tooltip, notification, combo, dnd.
# Supported keys:
#   fade, shadow, blur-background: enable/disable each effect for this type.
#   opacity: 0.0..1.0; focus: true always considers this type focused.
#   full-shadow: draw shadows beneath transparent window contents.
#   clip-shadow-above: clip shadows of windows above this type.
#   redir-ignore: do not trigger recompositing when unredirected.
#   animation, animation-unmap, animation-workspace-in, animation-workspace-out:
#     choose an effect listed in the animations section.
# Global fading: fading = true; fade-in-step/fade-out-step set opacity increments
# (0.0..1.0), and fade-delta sets the interval in ms.
# Example inside wintypes: tooltip = { opacity = 0.9; animation = "slide-up"; };
wintypes:
{
  desktop = {
    fade = true;
    shadow = true;
    opacity = 0.75;
    focus = false;
    full-shadow = false;
    animation = "zoom";
  };
  notification = {
    fade = true;
    shadow = false;
    # Keep content behind notifications visible through the opacity.
    blur-background = false;
    opacity = 0.60;
    # Prevent inactive-opacity-override from making notifications opaque.
    focus = true;
    full-shadow = false;
    animation = "zoom";
  };
  dock = {
    animation = "none";
    shadow = false;
    clip-shadow-above = true;
  };
  dnd = {
    animation = "zoom";
    shadow = false;
  };
  menu = {
    animation = "auto";
    shadow = false;
  };
  popup_menu = {
    animation = "auto";
    shadow = false;
  };
  dropdown_menu = {
    animation = "auto";
    shadow = false;
  };
};
