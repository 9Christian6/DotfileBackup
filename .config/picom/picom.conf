# Configuration for ~/Opt/picom-animations.
# Option reference: that source tree's src/config_libconfig.c and picom.sample.conf.
# Active assignments are the current settings. Commented assignments are examples;
# uncomment to add an option, or edit its existing assignment to avoid duplicates.
# Booleans accept true/false. Opacity uses 0.0 (invisible) to 1.0 (opaque),
# except opacity-rule, which uses percentages. Dimensions are pixels unless noted.
#
# Window conditions: entries in exclusion arrays are alternatives (logical OR).
#   class_g = 'Name'       Exact application class; inspect with xprop WM_CLASS.
#   class_g ?= 'Name'      Case-insensitive class match.
#   name *= 'text'        Window title contains text.
#   window_type = 'dock'  Match an EWMH window type.
#   _GTK_FRAME_EXTENTS@:c Client property exists.
# Combine conditions with &&, || and !; use parentheses to group them:
#   "class_g = 'Alacritty' && !fullscreen"
# Legacy n:e:Menu means name equals Menu. Use xprop to inspect window properties.

# --- Animations ---
# Effects: "none", "auto", "fly-in", "zoom", "squeeze", "slide-up",
# "slide-down", "slide-left", "slide-right". "none" disables an effect;
# "auto" selects an effect according to the window/transition.
# Enable movement/scaling animations. Transient windows include dialogs;
# workspace-switch-in/out control windows appearing/disappearing across workspaces.
animations = true;
animation-for-open-window = "zoom";
animation-for-transient-window = "zoom";
animation-for-workspace-switch-in = "auto";
animation-for-workspace-switch-out = "auto";
# Native Brave tab previews must follow the pointer without spring animation.
animation-exclude = [
  "class_g ?= 'Brave-browser' && override_redirect && role = 'browser'"
];

# Optional closing/hiding effect and global spring tuning (defaults shown).
# Higher stiffness pulls harder, dampening reduces oscillation, mass adds inertia.
# animation-for-unmap-window = "auto";
# animation-stiffness = 200.0;
# animation-dampening = 25.0;
# animation-window-mass = 1.0;
# animation-delta = 10.0;         # Simulation step interval in milliseconds.
# animation-force-steps = false; # true forces step-by-step updates under CPU load.
# animation-clamping = true;     # Stop each animated component at its target.
# animation-exclude = [ "class_g = 'Example'" ];

# --- Fading ---
# Fading changes opacity; wintypes below enable it for desktop/notification.
# Optional global fading and timing; larger steps produce faster fades.
# fading = true;
# fade-in-step = 0.028; # Opacity increment per step (0.0..1.0).
# fade-out-step = 0.03;
# fade-delta = 10;      # Interval between steps in milliseconds.
# fade-exclude = [ "class_g = 'Example'" ];
# no-fading-openclose = true;      # Only fade subsequent opacity changes.
# no-fading-destroyed-argb = true; # Work around fades of destroyed ARGB windows.

# --- Shadows ---
# Global switch; wintypes below can override it (desktop currently enables it).
# Radius softens the shadow; negative offsets move it left/up.
shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c",
  "name = 'cpt_frame_window'",
  "n:e:Menu"
];

# Optional shadow appearance and clipping.
# shadow-opacity = 0.75;
# shadow-color = "#000000";
# clip-shadow-above = [ "window_type = 'dock'" ]; # Clip other shadows above docks.
# shadow-ignore-shaped = true; # Skip shadows on windows with an X Shape mask.
# detect-rounded-corners = true; # Treat rounded shapes as rectangular for shadows.
# xinerama-shadow-crop = true; # Keep shadows within their Xinerama screen.

# --- Opacity and focus ---
# Titlebar/border opacity, independent of window content.
frame-opacity = 0.7;
# Let inactive opacity override the window's own opacity property.
inactive-opacity-override = true;
# Darken inactive windows by 10%; 0.0 disables dimming.
inactive-dim = 0.1;
# true groups focus by WM_CLIENT_LEADER (usually windows of one application).
detect-client-leader = false;
# Matching windows are always considered focused, avoiding inactive dimming.
focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'gnome-calendar'",
  "class_g = 'Dunst'",
  "class_g = 'steam'"
];

# Optional opacity and focus policies.
# active-opacity = 1.0;
# inactive-opacity = 0.9;
# opacity-rule = [ "90:class_g = 'Alacritty'" ]; # PERCENT:CONDITION (0..100).
# inactive-dim-fixed = true; # Do not scale dimming with window opacity.
# detect-transient = true; # Group focus via WM_TRANSIENT_FOR.
# detect-client-opacity = true; # Also read opacity properties on client windows.
# use-ewmh-active-win = true; # Determine focus from the WM's _NET_ACTIVE_WINDOW.
# mark-wmwin-focused = true; # Treat window-manager windows as focused.
# mark-ovredir-focused = true; # Treat unmanaged override-redirect windows as focused.

# --- Rounded corners ---
# Radius in pixels; 0 disables rounding. Exclusions apply when radius > 0.
corner-radius = 0;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Background blur ---
# Methods: "none" (disabled), "kernel", "box", "gaussian", "dual_kawase".
# Dual Kawase requires --experimental-backends; backend support varies.
blur-method = "dual_kawase";
# Dual Kawase strength (1..20); higher values increase blur.
blur-strength = 7;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Optional blur parameters; size/deviation/kernel apply to their respective methods.
# blur-size = 3;              # Box/Gaussian radius.
# blur-deviation = 0.84089642; # Gaussian standard deviation.
# blur-kern = "3x3box";       # Kernel presets include 5x5box and 3x3gaussian.
# blur-background-frame = true; # Also blur translucent titlebars/borders.
# blur-background-fixed = true; # Do not vary blur with opacity.
# blur-background-strength = [ "0:class_g = 'Alacritty'" ]; # STRENGTH:CONDITION.

# --- Rendering and diagnostics ---
# Backends: "xrender", "glx", "xr_glx_hybrid" (hybrid uses the legacy backends).
# Command-line options override this file. Example invocation for GLX blur:
# ~/Opt/picom-animations/build/src/picom --backend glx --experimental-backends
# backend = "glx";
# VSync synchronizes presentation to reduce tearing.
vsync = true;
# false keeps fullscreen windows composited; true may improve fullscreen
# performance by bypassing compositing, with possible flicker during transitions.
unredir-if-possible = false;
# Repaint changed regions; false redraws everything (artifact workaround).
use-damage = true;
# Synchronize client drawing with X Sync fences; useful with some drivers.
xrender-sync-fence = true;
# true forces blending even for opaque windows.
force-win-blend = false;
# Levels: trace, debug, info, warn, error.
log-level = "warn";

# Optional rendering policies and driver workarounds.
# unredir-if-possible-delay = 100; # Milliseconds before bypassing compositing.
# unredir-if-possible-exclude = [ "class_g = 'Example'" ];
# no-ewmh-fullscreen = true; # Detect fullscreen using window size/position only.
# glx-no-stencil = true; # Avoid the GLX stencil buffer; may affect blur.
# glx-no-rebind-pixmap = true; # Avoid rebinding damaged pixmaps; driver dependent.
# resize-damage = 1; # Expand damage used for blur calculation by this many pixels.
# transparent-clipping = true; # Transparent windows clip windows behind them;
#                             # requires --experimental-backends.
# invert-color-include = [ "class_g = 'Example'" ]; # Invert matching window colors.
# max-brightness = 0.9; # Cap average brightness; requires experimental GLX and
#                     # use-damage = false. 1.0 disables the cap.

# Optional logging and process control.
# log-file = "/tmp/picom.log"; # Otherwise stderr; use an absolute path.
# dbus = true;                # Enable D-Bus remote control.
# write-pid-path = "/tmp/picom.pid";

# --- Per-window-type overrides ---
# Types: unknown, desktop, dock, toolbar, menu, utility, splash, dialog, normal,
# dropdown_menu, popup_menu, tooltip, notification, combo, dnd.
# Supported keys:
#   fade, shadow: override the global switches for this type.
#   blur-background: allow blur for this type when a blur method is enabled.
#   opacity: 0.0..1.0; focus: true always considers this type focused,
#     false uses normal focus detection (it does not force the type unfocused).
#   full-shadow: draw shadows beneath transparent window contents.
#   clip-shadow-above: clip shadows of windows above this type.
#   redir-ignore: do not trigger recompositing when unredirected.
#   animation, animation-unmap, animation-workspace-in, animation-workspace-out:
#     choose an effect listed in the animations section.
# Add entries inside the existing wintypes block, for example:
#   tooltip = { opacity = 0.9; animation = "slide-up"; animation-unmap = "zoom"; };
wintypes:
{
  desktop = {
    fade = true;
    shadow = true;
    opacity = 0.75;
    focus = false;
    full-shadow = false;
    animation = "zoom";
  };
  notification = {
    fade = true;
    shadow = false;
    # Show the content behind notifications without blurring it.
    blur-background = false;
    opacity = 0.60;
    # Prevent inactive-opacity-override from making notifications opaque.
    focus = true;
    full-shadow = false;
    animation = "zoom";
  };
  dock = {
    animation = "none";
    shadow = false;
    clip-shadow-above = true;
  };
  dnd = {
    # Drag previews must track the pointer without spring/zoom animation.
    animation = "none";
    shadow = false;
  };
  menu = {
    animation = "auto";
    shadow = false;
  };
  popup_menu = {
    animation = "auto";
    shadow = false;
  };
  dropdown_menu = {
    animation = "auto";
    shadow = false;
  };
};
