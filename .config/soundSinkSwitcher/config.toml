# Edits apply on the next hover, click or bar update.
# All discovered sinks are prefilled, including disconnected outputs.
# name="" uses the device description. enabled=false hides a sink and skips it when cycling.
# enabled only affects this switcher; it does not disable devices or change audio settings.
# allow_unknown=true permits outputs with no connection detection (e.g. S/PDIF).
# Known disconnected ports are always excluded. Defaults apply unless overridden.
[default]
name = ""
icon = "󰓃"
enabled = true
allow_unknown = false
show_name = false # Set true to show custom names beside the volume bar.

[sinks."alsa_output.usb-ASUS_Xonar_U7-00.analog-stereo"]
enabled = true
name = "Xonar U7"
